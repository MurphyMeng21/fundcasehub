<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FundCaseHub — 基金处罚案例库</title>
<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --c-bg:#f2f5f7;--c-surface:#fff;--c-border:#dde5ea;--c-text:#142c40;
  --c-text2:#617583;--c-text3:#849eaf;--c-accent:#007e7c;--c-accent-light:#e8f4f2;
  --c-navy:#142c40;--c-navy2:#213b4b;
  --c-green:#0d7d4a;--c-green-bg:#e6f4ed;--c-orange:#b85c00;--c-orange-bg:#fef3e5;
  --c-red:#c02020;--c-red-bg:#fce4e4;--c-yellow:#856404;--c-yellow-bg:#fff8e1;
  --sidebar-w:280px;--header-h:56px;--tab-h:44px;--radius:8px;--shadow:0 1px 3px rgba(0,0,0,.08);
  --font:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
body{font-family:var(--font);background:var(--c-bg);color:var(--c-text);line-height:1.6}#app{min-height:100vh;display:flex;flex-direction:row}
a{color:var(--c-accent);text-decoration:none}
button{cursor:pointer;border:none;background:none;font:inherit;color:inherit}
input,select{font:inherit}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:500;white-space:nowrap}
mark.highlight{background:#fde68a;color:inherit;padding:0 2px;border-radius:2px}
.sev-严重{background:var(--c-red-bg);color:var(--c-red)}.sev-较重{background:var(--c-orange-bg);color:var(--c-orange)}
.sev-一般{background:var(--c-yellow-bg);color:var(--c-yellow)}.sev-较轻{background:var(--c-green-bg);color:var(--c-green)}

#tab-bar{display:flex;flex-direction:column;background:var(--c-navy);border-right:1px solid var(--c-navy2);width:210px;flex-shrink:0;padding:24px 0;gap:4px}
.tab-btn{padding:11px 22px;font-size:14px;font-weight:500;color:#b9cad6;border-left:3px solid transparent;transition:all .2s;display:flex;align-items:center;gap:8px;text-align:left;width:100%;background:transparent}
.tab-btn:hover{color:#fff;background:var(--c-navy2)}
.tab-btn.active{color:#fff;border-left-color:var(--c-accent);background:var(--c-navy2);font-weight:600}

.module{display:none;flex:1;flex-direction:column;overflow:visible}
.module.active{display:flex}

#header{height:var(--header-h);background:var(--c-surface);border-bottom:1px solid var(--c-border);display:flex;align-items:center;padding:0 20px;gap:16px;flex-shrink:0}
#header h1{font-size:17px;font-weight:700;white-space:nowrap}
#search-wrap{flex:1;max-width:520px;position:relative}
#search-input,#search-input-cases{width:100%;height:36px;padding:0 40px 0 14px;border:1px solid var(--c-border);border-radius:var(--radius);font-size:14px;outline:none;transition:border-color .2s;background:var(--c-bg)}
#search-input:focus,#search-input-cases:focus{border-color:var(--c-accent);background:var(--c-surface)}
#search-input::placeholder,#search-input-cases::placeholder{color:var(--c-text3)}
.search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:18px;color:var(--c-text3);padding:4px 8px;display:none;z-index:2}
.search-clear.visible{display:block}
.header-stats{font-size:13px;color:var(--c-text2);white-space:nowrap}
.menu-btn{display:none;font-size:22px;padding:4px 8px}

#main-layout{display:flex;flex:1;min-height:0}
.sidebar{width:var(--sidebar-w);background:var(--c-surface);border-right:1px solid var(--c-border);overflow-y:auto;flex-shrink:0;padding:8px 0}
.sidebar-title{font-size:12px;font-weight:600;color:var(--c-text3);padding:8px 16px 4px;text-transform:uppercase;letter-spacing:.5px}
.sidebar-section{margin-bottom:8px}
.filter-item{display:flex;align-items:center;padding:6px 16px;cursor:pointer;font-size:13px;transition:background .15s;gap:8px;border-left:3px solid transparent}
.filter-item:hover{background:var(--c-accent-light)}
.filter-item.active{background:var(--c-accent-light);border-left-color:var(--c-accent);font-weight:600;color:var(--c-accent)}
.filter-name{flex:1}
.filter-count{font-size:11px;color:var(--c-text3);background:var(--c-bg);padding:1px 7px;border-radius:10px;min-width:24px;text-align:center}
.filter-item.active .filter-count{background:var(--c-accent);color:#fff}

#content{flex:1;overflow-y:auto;padding:16px 20px}
.list-container{display:flex;flex-direction:column;gap:10px}
.detail-container{display:none}
.detail-container.active{display:block}

.card{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius);padding:14px 18px;cursor:pointer;transition:box-shadow .2s,border-color .2s}
.card:hover{border-color:var(--c-accent);box-shadow:var(--shadow)}
.card-header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:6px}
.card-title{font-size:15px;font-weight:600;color:var(--c-text);line-height:1.4}
.card-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--c-text2)}
.card-preview{font-size:12px;color:var(--c-text3);margin-top:6px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}

.detail-container{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius);padding:24px 28px}
.detail-back{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--c-accent);margin-bottom:16px;padding:6px 12px;border-radius:var(--radius);transition:background .15s}
.detail-back:hover{background:var(--c-accent-light)}
.detail-title{font-size:20px;font-weight:700;margin-bottom:10px}
.detail-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;font-size:13px;color:var(--c-text2)}
.detail-section{margin:16px 0}
.detail-section h3{font-size:14px;font-weight:600;margin-bottom:8px;color:var(--c-text)}
.detail-text{font-size:14px;line-height:1.8;white-space:pre-wrap;word-break:break-word;max-height:60vh;overflow-y:auto;padding:12px;background:var(--c-bg);border-radius:var(--radius);margin-top:8px}
.detail-warning{background:var(--c-yellow-bg);color:var(--c-yellow);padding:10px 14px;border-radius:var(--radius);font-size:13px;margin-bottom:12px}

.stats-bar{display:flex;gap:12px;padding:0 0 12px;flex-wrap:wrap}
.stat-item{font-size:13px;padding:4px 10px;border-radius:var(--radius);background:var(--c-surface);border:1px solid var(--c-border)}

.empty-state{text-align:center;padding:60px 20px;color:var(--c-text3)}
.empty-state .icon{font-size:48px;margin-bottom:12px}
.empty-state h3{font-size:18px;margin-bottom:6px;color:var(--c-text2)}

.loading-wrap{text-align:center;padding:50px 20px;color:var(--c-text3);font-size:14px}
.spinner{display:inline-block;width:28px;height:28px;border:3px solid var(--c-border);border-top-color:var(--c-accent);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:10px}
@keyframes spin{to{transform:rotate(360deg)}}

.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:49}
.overlay.open{display:block}

/* ===== 案例库：顶部筛选区 ===== */
#filter-bar{background:var(--c-surface);border-bottom:1px solid var(--c-border);padding:10px 20px;flex-shrink:0;position:relative}
.filter-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.filter-row:last-child{margin-bottom:0}
.filter-label{font-size:12px;color:var(--c-text3);white-space:nowrap;flex-shrink:0}
.chip{display:inline-flex;align-items:center;padding:3px 12px;border:1px solid var(--c-border);border-radius:16px;font-size:13px;cursor:pointer;background:var(--c-surface);transition:all .15s;white-space:nowrap;user-select:none}
.chip:hover{border-color:var(--c-accent);color:var(--c-accent)}
.chip.active{background:var(--c-accent);color:#fff;border-color:var(--c-accent)}
.segmented{display:inline-flex;border:1px solid var(--c-border);border-radius:var(--radius);overflow:hidden;flex-shrink:0}
.segmented button{padding:5px 16px;font-size:13px;background:var(--c-surface);color:var(--c-text2);transition:all .15s}
.segmented button.active{background:var(--c-accent);color:#fff}
.src-toggle{padding:5px 14px;border:1px solid var(--c-border);border-radius:var(--radius);font-size:13px;background:var(--c-surface);display:inline-flex;align-items:center;gap:4px}
.src-toggle:hover{border-color:var(--c-accent);color:var(--c-accent)}
.src-toggle.active{border-color:var(--c-accent);color:var(--c-accent)}
/* 来源机构弹层 */
#src-popover{position:absolute;z-index:60;background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius);box-shadow:0 6px 20px rgba(0,0,0,.15);max-height:430px;overflow:auto;width:500px;display:none;left:20px}
#src-popover.open{display:block}
.src-pop-search{position:sticky;top:0;background:var(--c-surface);padding:10px 12px;border-bottom:1px solid var(--c-border)}
.src-pop-search input{width:100%;height:32px;padding:0 12px;border:1px solid var(--c-border);border-radius:var(--radius);font-size:13px;outline:none}
.src-group{padding:8px 12px}
.src-group-title{font-size:12px;font-weight:600;color:var(--c-text3);margin-bottom:4px}
.src-option{display:flex;align-items:center;gap:6px;padding:3px 8px;font-size:13px;cursor:pointer;border-radius:4px}
.src-option:hover{background:var(--c-accent-light)}
.src-option input{margin:0;flex-shrink:0}
.src-option .n{font-size:11px;color:var(--c-text3);margin-left:auto}
/* 已选条件 */
.active-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--c-text2);min-height:22px}
.active-chip{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;background:var(--c-accent-light);color:var(--c-accent);border-radius:14px;font-size:12px}
.active-chip .x{cursor:pointer;font-size:14px;line-height:1}
.clear-all{font-size:12px;color:var(--c-text3);cursor:pointer}
.clear-all:hover{color:var(--c-accent)}
.result-count{font-size:13px;color:var(--c-text2)}
.result-count strong{color:var(--c-accent)}
/* ===== 案例库：紧凑列表 ===== */
.case-list{display:flex;flex-direction:column;gap:0}
.case-row{display:flex;align-items:flex-start;gap:12px;padding:11px 20px;border-bottom:1px solid var(--c-border);cursor:pointer;transition:background .12s;background:var(--c-surface)}
.case-row:hover{background:var(--c-accent-light)}
.fav-btn{flex-shrink:0;cursor:pointer;font-size:16px;line-height:1;margin-top:2px;user-select:none}
.pt-badge{flex-shrink:0;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:500;margin-top:2px}
.pt-自然人{background:var(--c-green-bg);color:var(--c-green)}
.pt-机构{background:var(--c-accent-light);color:var(--c-accent)}
.case-main{flex:1;min-width:0}
.case-title{font-size:14px;font-weight:600;line-height:1.4;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.case-title .pos{font-size:11px;color:var(--c-text2);background:#f0f0f0;padding:1px 6px;border-radius:3px;font-weight:400}
.case-sub{font-size:12.5px;color:var(--c-text2);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.case-sub .tg{font-size:11px;background:var(--c-accent-light);color:var(--c-accent);padding:1px 7px;border-radius:10px}
.case-sub .pen{color:var(--c-text);font-weight:500}
.case-meta{font-size:12px;color:var(--c-text3);margin-top:3px}

@media(max-width:768px){
  #header h1{font-size:14px}
  .header-stats{display:none}
  .menu-btn{display:block!important}
  .sidebar{position:fixed;left:calc(-1*var(--sidebar-w));top:calc(var(--header-h) + var(--tab-h));bottom:0;z-index:50;transition:left .3s;box-shadow:2px 0 8px rgba(0,0,0,.1)}
  .sidebar.open{left:0}
  #content{padding:12px}
  .card{padding:10px 12px}
  .card-title{font-size:13px}
  .detail-container{padding:14px}
  .detail-title{font-size:17px}
  .detail-text{font-size:13px;max-height:50vh}
}
</style>
</head>
<body>
<div id="app">
  <div id="tab-bar">
    <div style="padding:0 22px 22px;color:#fff;font-size:16px;font-weight:700;line-height:1.4">私募基金<br>案例库</div>
    <button class="tab-btn active" data-module="cases">🔍 案例检索</button>
    <button class="tab-btn" data-module="topics">🗂️ 风险专题</button>
    <button class="tab-btn" data-module="favs">⭐ 我的收藏</button>
  </div>

  <!-- CASE MODULE -->
  <div id="module-cases" class="module active">
    <header id="header-cases" style="height:var(--header-h);background:var(--c-surface);border-bottom:1px solid var(--c-border);display:flex;align-items:center;padding:0 20px;gap:16px;flex-shrink:0">
      <h1 style="font-size:17px;font-weight:700;white-space:nowrap">案例<span style="color:var(--c-accent)">检索</span></h1>
      <div style="flex:1;max-width:520px;position:relative"><input type="text" id="search-input-cases" placeholder="搜索当事人、文号、违规类型、处分结果..."><button class="search-clear" id="search-clear-cases">✕</button></div>
      <div class="header-stats">共 <strong id="total-count-cases">0</strong> 条</div>
    </header>
    <div id="filter-bar"><div id="filter-rows"></div><div id="src-popover"></div></div>
    <main id="content-cases" style="flex:1;overflow-y:auto;padding:0"><div class="loading-wrap"><div class="spinner"></div><div>加载案例数据...</div></div></main>
  </div>

  <!-- TOPICS MODULE -->
  <div id="module-topics" class="module">
    <header style="height:var(--header-h);background:var(--c-surface);border-bottom:1px solid var(--c-border);display:flex;align-items:center;padding:0 20px;flex-shrink:0">
      <h1 style="font-size:17px;font-weight:700">风险<span style="color:var(--c-accent)">专题</span></h1>
    </header>
    <main id="content-topics" style="flex:1;overflow-y:auto;padding:20px"><div class="loading-wrap"><div class="spinner"></div><div>加载中...</div></div></main>
  </div>

  <!-- FAVORITES MODULE -->
  <div id="module-favs" class="module">
    <header style="height:var(--header-h);background:var(--c-surface);border-bottom:1px solid var(--c-border);display:flex;align-items:center;padding:0 20px;flex-shrink:0">
      <h1 style="font-size:17px;font-weight:700">我的<span style="color:var(--c-accent)">收藏</span></h1>
    </header>
    <main id="content-favs" style="flex:1;overflow-y:auto;padding:0"><div class="loading-wrap"><div class="spinner"></div><div>加载中...</div></div></main>
  </div>
</div>

<script>
// ===== SHELL =====
const $ = (s,d=document) => d.querySelector(s);
const $$ = (s,d=document) => d.querySelectorAll(s);
let currentModule = 'cases';

$$('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.dataset.module === currentModule) return;
    currentModule = btn.dataset.module;
    $$('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
    $$('.module').forEach(m => m.classList.toggle('active', m.id === `module-${currentModule}`));
    if (currentModule === 'topics') renderTopics();
    else if (currentModule === 'favs') renderFavs();
  });
});


// ===== UTILS =====
function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function trunc(s, n) { return s && s.length > n ? s.slice(0, n) + '…' : s || ''; }
function htm(s, q) {
  if (!s) return '';
  let h = esc(s);
  if (q && q.trim()) {
    const terms = q.trim().split(/\s+/).filter(t => t.length > 0);
    for (const t of terms) {
      const e = t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      h = h.replace(new RegExp(`(${e})`, 'gi'), '<mark class="highlight">$1</mark>');
    }
  }
  return h;
}

// ===== CASE MODULE =====
window._casesLoaded = false;
function initCaseModule() { if (!window._casesLoaded) { window._casesLoaded = true; loadCaseModule(); } }

const caseState = { cases: [], filtered: [], activeTags: [], activePartyType: 'all', activeSrcs: [], activeSev: 'all', activePenaltyType: 'all', activeBusinessStage: 'all', query: '', fuse: null, expandedId: null, fullTexts: {}, favs: [] };

// ===== 收藏（localStorage）=====
const FAV_KEY = 'fundcasehub-favs';
function loadFavs() { try { return JSON.parse(localStorage.getItem(FAV_KEY) || '[]'); } catch (e) { return []; } }
function saveFavs() { try { localStorage.setItem(FAV_KEY, JSON.stringify(caseState.favs)); } catch (e) {} }
function isFav(id) { return caseState.favs.includes(id); }
function toggleFav(id) { const i = caseState.favs.indexOf(id); if (i >= 0) caseState.favs.splice(i, 1); else caseState.favs.push(id); saveFavs(); }

// 常用违规类型（高频二级标签，放前面）；其余收进「全部类型」面板
const HOT_TAGS = ['勤勉义务','销售违规','合格投资者','人员场所','登记备案','信息披露','挪用侵占','内控合规'];

// 省局管辖范围标注：计划单列市有独立证监局，省局名后标注「不含XX」
const SRC_SCOPE = {
  '广东证监局': '广东证监局（不含深圳）',
  '浙江证监局': '浙江证监局（不含宁波）',
  '山东证监局': '山东证监局（不含青岛）',
  '辽宁证监局': '辽宁证监局（不含大连）',
  '福建证监局': '福建证监局（不含厦门）',
};

function shortSrc(s) {
  if (!s) return '其他';
  if (SRC_SCOPE[s]) return SRC_SCOPE[s];
  if (s.includes('中基协')) return '中基协';
  if (s.includes('上海证券')) return '上交所';
  if (s.includes('北京证券')) return '北交所';
  if (s.includes('股转')) return '股转';
  return s;
}

async function loadCaseModule() {
  const content = $('#content-cases');
  try {
    const [r1, r2] = await Promise.all([fetch('data/cases.json'), fetch('data/cases_full.json')]);
    caseState.cases = await r1.json(); caseState.fullTexts = await r2.json(); caseState.filtered = [...caseState.cases];
    caseState.favs = loadFavs();
    caseState.fuse = new Fuse(caseState.cases, {
      keys: [{name:'party',weight:0.3},{name:'content_preview',weight:0.3},{name:'tags',weight:0.2},{name:'case_no',weight:0.1},{name:'penalty',weight:0.1}],
      threshold: 0.35, distance: 100, minMatchCharLength: 1, includeScore: true, includeMatches: true, ignoreLocation: true, ignoreFieldNorm: true
    });
    renderCaseFilterBar(); renderCaseList(caseState.cases); bindCaseEvents();
    $('#total-count-cases').textContent = caseState.cases.length;
  } catch(e) { content.innerHTML = `<div class="empty-state"><div class="icon">❌</div><h3>数据加载失败</h3><div>${esc(e.message)}</div></div>`; }
}

// Config
const L1_CATS = ['公司治理与登记备案','募集销售与投资者适当性','产品运作与合同一致性','程序化交易与算法管理','异常交易与市场操纵','网下打新'];
const L2_LABELS = {
  '公司治理与登记备案': ['登记备案','内控合规','人员场所','虚假材料','信息报送','不配合监管','违规减持'],
  '募集销售与投资者适当性': ['合格投资者','销售违规','承诺收益','公开宣传','非法集资'],
  '产品运作与合同一致性': ['勤勉义务','信息披露','关联交易','挪用侵占','投资运作违规','估值违规','期货与资管业务','风险指标违规','资金池混同','募新还旧'],
  '程序化交易与算法管理': ['程序化交易管理'],
  '异常交易与市场操纵': ['异常交易行为','市场操纵内幕交易'],
  '网下打新': ['网下打新违规'],
};

function findTag(l2) {
  for (const [l1, l2s] of Object.entries(L2_LABELS)) {
    if (l2s.includes(l2)) return `${l1}/${l2}`;
  }
  return null;
}

function resetDetail() {
  caseState.expandedId = null;
  const dc = $('#content-cases .detail-container'); if (dc) { dc.classList.remove('active'); dc.innerHTML=''; }
  const lc = $('#content-cases .list-container'); if (lc) lc.style.display = '';
}

function renderCaseFilterBar() {
  const rows = $('#filter-rows');
  let h = '';

  // 行1：违规类型（高频 chips + 全部类型）
  h += '<div class="filter-row"><span class="filter-label">违规类型</span>';
  for (const l2 of HOT_TAGS) {
    const fullTag = findTag(l2);
    if (!fullTag) continue;
    h += `<button class="chip${caseState.activeTags.includes(fullTag)?' active':''}" data-tag="${fullTag}">${l2}</button>`;
  }
  h += '<button class="chip" data-action="toggle-types">全部类型 ▾</button>';
  h += '</div>';

  // 行2：处罚类型 + 当事人类型 + 来源机构 + 处分级别
  h += '<div class="filter-row">';
  h += '<span class="filter-label">处罚类型</span><div class="segmented">';
  for (const pt of ['all','监管措施','行政处罚']) {
    const label = pt === 'all' ? '全部' : pt;
    h += `<button class="${caseState.activePenaltyType===pt?'active':''}" data-penalty="${pt}">${label}</button>`;
  }
  h += '</div>';
  h += '<span class="filter-label">业务环节</span><div class="segmented">';
  for (const bs of ['all','募集推介','投资运作','存续管理','机构治理']) {
    const label = bs === 'all' ? '全部' : bs;
    h += `<button class="${caseState.activeBusinessStage===bs?'active':''}" data-stage="${bs}">${label}</button>`;
  }
  h += '</div>';
  h += '<span class="filter-label">当事人</span><div class="segmented">';
  for (const pt of ['all','自然人','机构']) {
    const label = pt === 'all' ? '全部' : pt;
    h += `<button class="${caseState.activePartyType===pt?'active':''}" data-pt="${pt}">${label}</button>`;
  }
  h += '</div>';
  h += '<span class="filter-label">来源机构</span>';
  h += `<button class="src-toggle${caseState.activeSrcs.length?' active':''}" id="src-toggle">${caseState.activeSrcs.length ? '已选 '+caseState.activeSrcs.length+' 个 ▾' : '全部来源 ▾'}</button>`;
  h += '<span class="filter-label">处分级别</span>';
  h += '<select id="sev-select" style="padding:5px 8px;border:1px solid var(--c-border);border-radius:var(--radius);font-size:13px;background:var(--c-surface)">';
  h += '<option value="all">全部</option>';
  for (const sev of ['严重','较重','一般','较轻']) h += `<option value="${sev}"${caseState.activeSev===sev?' selected':''}>${sev}</option>`;
  h += '</select>';
  h += '</div>';

  // 行3：已选条件 + 结果数
  h += '<div class="active-bar">';
  h += `<span class="result-count">共 <strong>${caseState.filtered.length}</strong> 条</span>`;
  const chips = [];
  for (const tag of caseState.activeTags) chips.push(`<span class="active-chip">违规:${tag.split('/').pop()}<span class="x" data-remove-tag="${tag}">✕</span></span>`);
  if (caseState.activePartyType !== 'all') chips.push(`<span class="active-chip">当事人:${caseState.activePartyType}<span class="x" data-remove-pt>✕</span></span>`);
  for (const src of caseState.activeSrcs) chips.push(`<span class="active-chip">来源:${shortSrc(src)}<span class="x" data-remove-src="${src}">✕</span></span>`);
  if (caseState.activeSev !== 'all') chips.push(`<span class="active-chip">级别:${caseState.activeSev}<span class="x" data-remove-sev>✕</span></span>`);
  if (caseState.activePenaltyType !== 'all') chips.push(`<span class="active-chip">处罚:${caseState.activePenaltyType}<span class="x" data-remove-penalty>✕</span></span>`);
  if (caseState.activeBusinessStage !== 'all') chips.push(`<span class="active-chip">环节:${caseState.activeBusinessStage}<span class="x" data-remove-stage>✕</span></span>`);
  if (chips.length) { h += chips.join(''); h += '<span class="clear-all" data-clear>清空筛选</span>'; }
  h += '</div>';

  rows.innerHTML = h;
  bindFilterEvents();
}

function bindFilterEvents() {
  $$('#filter-rows .chip[data-tag]').forEach(el => el.addEventListener('click', () => {
    const tag = el.dataset.tag; const i = caseState.activeTags.indexOf(tag);
    if (i >= 0) caseState.activeTags.splice(i, 1); else caseState.activeTags.push(tag);
    resetDetail(); doCaseSearch(); renderCaseFilterBar();
  }));
  const typeBtn = $('#filter-rows .chip[data-action="toggle-types"]');
  if (typeBtn) typeBtn.addEventListener('click', (e) => { e.stopPropagation(); renderTypePopover(); });
  $$('#filter-rows .segmented button').forEach(el => el.addEventListener('click', () => {
    if (el.dataset.penalty !== undefined) caseState.activePenaltyType = el.dataset.penalty;
    else if (el.dataset.pt !== undefined) caseState.activePartyType = el.dataset.pt;
    else if (el.dataset.stage !== undefined) caseState.activeBusinessStage = el.dataset.stage;
    resetDetail(); doCaseSearch(); renderCaseFilterBar();
  }));
  const srcToggle = $('#src-toggle');
  if (srcToggle) srcToggle.addEventListener('click', (e) => { e.stopPropagation(); renderSrcPopover(); });
  const sevSel = $('#sev-select');
  if (sevSel) sevSel.addEventListener('change', () => { caseState.activeSev = sevSel.value; resetDetail(); doCaseSearch(); renderCaseFilterBar(); });
  $$('#filter-rows .active-chip .x').forEach(el => el.addEventListener('click', () => {
    if (el.dataset.removeTag !== undefined) { const i = caseState.activeTags.indexOf(el.dataset.removeTag); if (i>=0) caseState.activeTags.splice(i,1); }
    if (el.dataset.removePt !== undefined) caseState.activePartyType = 'all';
    if (el.dataset.removeSrc !== undefined) { const i = caseState.activeSrcs.indexOf(el.dataset.removeSrc); if (i>=0) caseState.activeSrcs.splice(i,1); }
    if (el.dataset.removeSev !== undefined) caseState.activeSev = 'all';
    if (el.dataset.removePenalty !== undefined) caseState.activePenaltyType = 'all';
    if (el.dataset.removeStage !== undefined) caseState.activeBusinessStage = 'all';
    resetDetail(); doCaseSearch(); renderCaseFilterBar();
  }));
  const clear = $('#filter-rows .clear-all');
  if (clear) clear.addEventListener('click', () => { caseState.activeTags = []; caseState.activePartyType = 'all'; caseState.activeSrcs = []; caseState.activeSev = 'all'; caseState.activePenaltyType = 'all'; caseState.activeBusinessStage = 'all'; resetDetail(); doCaseSearch(); renderCaseFilterBar(); });
}

function renderSrcPopover() {
  const pop = $('#src-popover');
  const groups = { '地方证监局': [], '协会': [], '交易所': [] };
  const allSrcs = new Set();
  for (const c of caseState.cases) allSrcs.add(c.source || '其他');
  for (const src of allSrcs) {
    if (src.includes('证监局')) groups['地方证监局'].push(src);
    else if (src.includes('中基协') || src.includes('协会')) groups['协会'].push(src);
    else groups['交易所'].push(src);
  }
  for (const g in groups) groups[g].sort((a,b) => a.localeCompare(b, 'zh'));

  let h = '<div class="src-pop-search"><input type="text" id="src-search-input" placeholder="搜索来源机构..."></div>';
  for (const [gname, srcs] of Object.entries(groups)) {
    if (!srcs.length) continue;
    h += `<div class="src-group"><div class="src-group-title">${gname}（${srcs.length}）</div>`;
    for (const src of srcs) {
      h += `<label class="src-option" data-src="${src}"><input type="checkbox"${caseState.activeSrcs.includes(src)?' checked':''}> ${shortSrc(src)}</label>`;
    }
    h += '</div>';
  }
  pop.innerHTML = h;
  pop.classList.add('open');
  $$('#src-popover .src-option').forEach(el => el.addEventListener('change', () => {
    const src = el.dataset.src; const i = caseState.activeSrcs.indexOf(src);
    if (i >= 0) caseState.activeSrcs.splice(i, 1); else caseState.activeSrcs.push(src);
    resetDetail(); doCaseSearch(); renderCaseFilterBar();
  }));
  const si = $('#src-search-input');
  if (si) si.addEventListener('input', () => {
    const q = si.value.trim();
    $$('#src-popover .src-option').forEach(el => { el.style.display = el.dataset.src.includes(q) || shortSrc(el.dataset.src).includes(q) ? '' : 'none'; });
  });
  setTimeout(() => document.addEventListener('click', function closePop(e) {
    if (!pop.contains(e.target) && !e.target.closest('#src-toggle')) { pop.classList.remove('open'); document.removeEventListener('click', closePop); }
  }), 0);
}

function renderTypePopover() {
  const pop = $('#src-popover');
  let h = '<div class="src-pop-search"><input type="text" id="type-search-input" placeholder="搜索违规类型..."></div>';
  for (const l1 of L1_CATS) {
    const l2s = (L2_LABELS[l1]||[]).filter(l2 => caseState.cases.some(c => (c.tags||[]).includes(`${l1}/${l2}`)));
    if (!l2s.length) continue;
    h += `<div class="src-group"><div class="src-group-title">${l1}</div>`;
    for (const l2 of l2s) {
      const tag = `${l1}/${l2}`;
      h += `<label class="src-option" data-tag="${tag}"><input type="checkbox"${caseState.activeTags.includes(tag)?' checked':''}> ${l2}</label>`;
    }
    h += '</div>';
  }
  pop.innerHTML = h;
  pop.classList.add('open');
  $$('#src-popover .src-option').forEach(el => el.addEventListener('change', () => {
    const tag = el.dataset.tag; const i = caseState.activeTags.indexOf(tag);
    if (i >= 0) caseState.activeTags.splice(i, 1); else caseState.activeTags.push(tag);
    resetDetail(); doCaseSearch(); renderCaseFilterBar();
  }));
  const si = $('#type-search-input');
  if (si) si.addEventListener('input', () => {
    const q = si.value.trim();
    $$('#src-popover .src-option').forEach(el => { el.style.display = el.textContent.includes(q) ? '' : 'none'; });
  });
  setTimeout(() => document.addEventListener('click', function closePop(e) {
    if (!pop.contains(e.target) && !e.target.closest('[data-action="toggle-types"]')) { pop.classList.remove('open'); document.removeEventListener('click', closePop); }
  }), 0);
}

function doCaseSearch() {
  let results;
  if (caseState.query.trim()) { const fr = caseState.fuse.search(caseState.query.trim()); results = fr.map(r => r.item); }
  else results = [...caseState.cases];
  // 违规类型（多选，满足任一）
  if (caseState.activeTags.length) results = results.filter(c => (c.tags||[]).some(t => caseState.activeTags.includes(t)));
  // 处罚类型（监管措施/行政处罚）
  if (caseState.activePenaltyType !== 'all') results = results.filter(c => (c.penalty_type || '监管措施') === caseState.activePenaltyType);
  // 业务环节
  if (caseState.activeBusinessStage !== 'all') results = results.filter(c => (c.business_stage || '') === caseState.activeBusinessStage);
  // 当事人类型
  if (caseState.activePartyType !== 'all') results = results.filter(c => c.party_type === caseState.activePartyType);
  // 来源机构（多选，满足任一）
  if (caseState.activeSrcs.length) results = results.filter(c => caseState.activeSrcs.includes(c.source));
  // 处分级别
  if (caseState.activeSev !== 'all') results = results.filter(c => c.severity === caseState.activeSev);
  caseState.filtered = results;
  renderCaseList(results);
  $('#total-count-cases').textContent = results.length;
  const rc = $('#filter-rows .result-count strong'); if (rc) rc.textContent = results.length;
}

function renderCaseList(cases) {
  const content = $('#content-cases'); content.innerHTML = '';
  if (!cases.length) { content.innerHTML = '<div class="empty-state"><div class="icon">🔍</div><h3>未找到匹配的案例</h3><div>请调整或清空筛选条件</div></div>'; return; }
  const list = document.createElement('div'); list.className = 'list-container case-list'; content.appendChild(list);
  const detail = document.createElement('div'); detail.className = 'detail-container'; content.appendChild(detail);
  for (const c of cases) {
    const row = document.createElement('div'); row.className = 'case-row'; row.dataset.id = c.id;
    const pt = c.party_type || '';
    const ptBadge = pt ? `<span class="pt-badge pt-${pt}">${esc(pt)}</span>` : '';
    const pos = c.position ? `<span class="pos">${esc(c.position)}</span>` : '';
    const xzcfBadge = c.penalty_type === '行政处罚' ? `<span class="badge" style="background:var(--c-red);color:#fff;font-size:10px;margin-left:6px">行政处罚</span>` : '';
    const tags = (c.tags||[]).slice(0,4).map(tag => `<span class="tg">${esc(tag.split('/').pop())}</span>`).join('');
    const sevBadge = c.severity ? `<span class="badge sev-${c.severity}" style="font-size:11px">${esc(c.severity)}</span>` : '';
    const meta = [shortSrc(c.source), c.date, c.case_no].filter(Boolean).join(' · ');
    row.innerHTML = `<span class="fav-btn" data-fav="${c.id}" title="收藏">${isFav(c.id) ? '⭐' : '☆'}</span>${ptBadge}<div class="case-main"><div class="case-title">${esc(c.party||c.name)}${pos}${xzcfBadge}</div><div class="case-sub">${tags}${c.penalty ? `<span class="pen">${esc(trunc(c.penalty, 50))}</span>` : ''}</div><div class="case-meta">${esc(meta)} ${sevBadge}</div></div>`;
    row.addEventListener('click', () => showCaseDetail(c));
    const fb = row.querySelector('.fav-btn');
    fb.addEventListener('click', (e) => { e.stopPropagation(); toggleFav(c.id); fb.textContent = isFav(c.id) ? '⭐' : '☆'; });
    list.appendChild(row);
  }
}

function showCaseDetail(c) {
  const list = $('#content-cases .list-container'), detail = $('#content-cases .detail-container');
  list.style.display = 'none'; detail.classList.add('active'); detail.innerHTML = ''; caseState.expandedId = c.id;
  const fullText = caseState.fullTexts[c.id] || '';
  const isXzcf = c.penalty_type === '行政处罚';
  let html = `<button class="detail-back">← 返回列表</button>
    <div class="detail-title">${esc(c.party||c.name)}${c.position ? `<span class="badge" style="background:#f0f0f0;color:#666;font-size:12px;margin-left:8px">${esc(c.position)}</span>` : ''} <span class="fav-btn" data-fav="${c.id}" style="cursor:pointer;font-size:16px">${isFav(c.id) ? '⭐' : '☆'}</span></div>`;

  // ===== ① 事实 =====
  html += '<div class="detail-section"><h3>📋 事实</h3>';
  html += `<table style="width:100%;border-collapse:collapse;margin-bottom:12px;font-size:14px">
    <tr><td style="padding:6px 12px 6px 0;color:var(--c-text2);white-space:nowrap;width:90px">处罚机构</td><td style="padding:6px 0">${esc(c.agency||'—')}</td></tr>
    <tr><td style="padding:6px 12px 6px 0;color:var(--c-text2)">被处罚对象</td><td style="padding:6px 0"><strong>${esc(c.party||c.name)}</strong> <span class="badge" style="background:var(--c-accent-light);color:var(--c-accent)">${esc(c.party_type||'')}</span></td></tr>
    <tr><td style="padding:6px 12px 6px 0;color:var(--c-text2)">时间</td><td style="padding:6px 0">${esc(c.date)}${c.case_no ? ' · 文号：'+esc(c.case_no) : ''}</td></tr>
    <tr><td style="padding:6px 12px 6px 0;color:var(--c-text2)">处罚结果</td><td style="padding:6px 0"><strong style="color:var(--c-red)">${esc(c.penalty||'—')}</strong></td></tr>
  </table>`;
  if ((c.violations||[]).length) {
    const realV = c.violations.filter(v => v.length > 15);
    for (let i = 0; i < realV.length; i++) {
      html += `<div style="margin:6px 0;padding:8px 12px;background:var(--c-bg);border-radius:4px;font-size:13px;line-height:1.6"><strong style="color:var(--c-accent)">${i+1}.</strong> ${esc(realV[i])}</div>`;
    }
  }
  if ((c.defense||[]).length) {
    html += '<div style="margin:8px 0 0;font-size:13px;color:var(--c-text2)"><strong>申辩意见：</strong>';
    html += c.defense.filter(d => d.length > 15).map(d => esc(d)).join('；');
    html += '</div>';
  }
  html += '</div>';

  // ===== ② 分析 =====
  html += '<div class="detail-section"><h3>🔍 分析</h3>';
  html += `<div style="margin-bottom:8px"><span style="color:var(--c-text2);font-size:13px;margin-right:6px">业务环节</span><span class="badge" style="background:var(--c-accent);color:#fff">${esc(c.business_stage||'—')}</span> <span style="color:var(--c-text2);font-size:13px;margin:0 6px">处罚类型</span><span class="badge" style="background:${isXzcf?'var(--c-red)':'var(--c-accent-light)'};color:${isXzcf?'#fff':'var(--c-accent)'}">${esc(c.penalty_type||'监管措施')}</span></div>`;
  if ((c.tags||[]).length) {
    const byL1 = {};
    for (const tag of (c.tags||[])) {
      const [l1, l2] = tag.split('/');
      if (!byL1[l1]) byL1[l1] = [];
      byL1[l1].push(l2);
    }
    html += '<div style="font-size:13px"><span style="color:var(--c-text2);margin-right:6px">风险主题</span>';
    for (const [l1, l2s] of Object.entries(byL1)) {
      html += `<div style="margin:4px 0"><span class="badge" style="background:var(--c-accent);color:#fff;font-size:12px;margin-right:4px">${esc(l1)}</span>${l2s.map(l2 => `<span class="badge" style="background:var(--c-accent-light);color:var(--c-accent);font-size:11px">${esc(l2)}</span>`).join(' ')}</div>`;
    }
    html += '</div>';
  }
  html += '</div>';

  // ===== ③ 来源 =====
  html += '<div class="detail-section"><h3>📖 来源</h3>';
  if ((c.laws||[]).length) {
    html += '<div style="margin-bottom:8px"><span style="color:var(--c-text2);font-size:13px;margin-right:6px">违反规定</span>';
    html += c.laws.slice(0,20).map(l => `<span class="badge" style="background:#f0f4ff;color:var(--c-accent);font-size:12px;border:1px solid #d0daf0;margin:2px">${esc(l)}</span>`).join('');
    html += '</div>';
  }
  html += `<div style="margin-bottom:8px;font-size:13px">📎 <a href="${esc(c.source_url)}" target="_blank" rel="noopener">查看原文</a> <span style="color:var(--c-text3);margin-left:6px">${esc(shortSrc(c.source||''))}</span></div>`;
  html += `<details style="font-size:13px"><summary style="cursor:pointer;color:var(--c-accent)">展开原文全文</summary><div class="detail-text" style="margin-top:8px">${htm(fullText, caseState.query)}</div></details>`;
  html += '</div>';

  detail.innerHTML = html;
  detail.querySelector('.detail-back').addEventListener('click', () => { detail.classList.remove('active'); detail.innerHTML=''; list.style.display=''; caseState.expandedId=null; });
  const dfb = detail.querySelector('.fav-btn');
  if (dfb) dfb.addEventListener('click', (e) => { e.stopPropagation(); toggleFav(c.id); dfb.textContent = isFav(c.id) ? '⭐' : '☆'; });
  $('#content-cases').scrollTop = 0;
}

function bindCaseEvents() {
  const si = $('#search-input-cases'), sc = $('#search-clear-cases'); let timer;
  si.addEventListener('input', () => { caseState.query = si.value; clearTimeout(timer); timer = setTimeout(() => { doCaseSearch(); if (caseState.expandedId) { const dc=$('#content-cases .detail-container'); if(dc){dc.classList.remove('active');dc.innerHTML='';} const lc=$('#content-cases .list-container'); if(lc)lc.style.display=''; caseState.expandedId=null; } }, 250); sc.classList.toggle('visible', caseState.query.length > 0); });
  sc.addEventListener('click', () => { si.value=''; caseState.query=''; sc.classList.remove('visible'); doCaseSearch(); si.focus(); });
}

function switchModule(mod) {
  currentModule = mod;
  $$('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.module === mod));
  $$('.module').forEach(m => m.classList.toggle('active', m.id === `module-${mod}`));
}

function renderTopics() {
  const content = $('#content-topics');
  const counts = {};
  for (const c of caseState.cases) for (const t of (c.tags||[])) counts[t] = (counts[t]||0) + 1;
  let html = '';
  for (const l1 of L1_CATS) {
    const subs = (L2_LABELS[l1]||[]).filter(l2 => counts[l1+'/'+l2]);
    if (!subs.length) continue;
    html += `<div style="margin-bottom:22px"><h3 style="font-size:15px;font-weight:700;margin:0 0 10px;color:var(--c-accent)">${esc(l1)}</h3><div style="display:flex;flex-wrap:wrap;gap:8px">`;
    for (const l2 of subs) {
      const tag = l1+'/'+l2;
      html += `<button class="topic-chip" data-tag="${esc(tag)}" style="padding:7px 14px;border:1px solid var(--c-border);border-radius:18px;background:var(--c-surface);cursor:pointer;font-size:13px;color:var(--c-text)">${esc(l2)} <span style="color:var(--c-text3);font-size:12px">${counts[tag]}</span></button>`;
    }
    html += '</div></div>';
  }
  content.innerHTML = html || '<div class="empty-state"><h3>暂无数据</h3></div>';
  content.querySelectorAll('.topic-chip').forEach(chip => chip.addEventListener('click', () => {
    caseState.activeTags = [chip.dataset.tag];
    switchModule('cases'); doCaseSearch(); renderCaseFilterBar();
  }));
}

function renderFavs() {
  const content = $('#content-favs');
  const favs = caseState.cases.filter(c => caseState.favs.includes(c.id));
  if (!favs.length) {
    content.innerHTML = '<div class="empty-state"><div class="icon" style="font-size:40px">⭐</div><h3>还没有收藏案例</h3><div>在案例列表或详情页点 ☆ 即可加入收藏</div></div>';
    return;
  }
  content.innerHTML = '';
  const list = document.createElement('div'); list.className = 'list-container case-list'; content.appendChild(list);
  for (const c of favs) {
    const row = document.createElement('div'); row.className = 'case-row';
    const pt = c.party_type || '';
    const ptBadge = pt ? `<span class="pt-badge pt-${pt}">${esc(pt)}</span>` : '';
    const xzcfBadge = c.penalty_type === '行政处罚' ? `<span class="badge" style="background:var(--c-red);color:#fff;font-size:10px;margin-left:6px">行政处罚</span>` : '';
    const tags = (c.tags||[]).slice(0,4).map(t => `<span class="tg">${esc(t.split('/').pop())}</span>`).join('');
    const meta = [shortSrc(c.source), c.date, c.case_no].filter(Boolean).join(' · ');
    row.innerHTML = `<span class="fav-btn" data-fav="${c.id}" title="取消收藏">⭐</span>${ptBadge}<div class="case-main"><div class="case-title">${esc(c.party||c.name)}${xzcfBadge}</div><div class="case-sub">${tags}${c.penalty ? `<span class="pen">${esc(trunc(c.penalty,50))}</span>` : ''}</div><div class="case-meta">${esc(meta)}</div></div>`;
    row.addEventListener('click', () => { switchModule('cases'); setTimeout(() => showCaseDetail(c), 60); });
    const fb = row.querySelector('.fav-btn');
    fb.addEventListener('click', (e) => { e.stopPropagation(); toggleFav(c.id); renderFavs(); });
    list.appendChild(row);
  }
}
